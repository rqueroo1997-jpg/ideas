name: CalculadoraPruebasFisicas
options:
  bundleIdPrefix: com.calculadorapruebasfisicas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

targets:
  CalculadoraPruebasFisicas:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CalculadoraPruebasFisicas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calculadorapruebasfisicas.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "Calculadora Pruebas Físicas"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    scheme:
      testTargets:
        - CalculadoraPruebasFisicasTests
      gatherCoverageData: true

  CalculadoraPruebasFisicasTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CalculadoraPruebasFisicasTests
    dependencies:
      - target: CalculadoraPruebasFisicas
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
